      rightByKey[k].push(r);
    });
    var matchedRightKeys = {};
    var result = [];
    leftRows.forEach(function (l) {
      var matches = rightByKey[l[leftKey]] || [];
      if (matches.length) {
        matches.forEach(function (r) { matchedRightKeys[r[rightKey]] = true; result.push(mergeRow(l, r)); });
      } else if (kind === "leftouter" || kind === "fullouter") {
        result.push(mergeRow(l, null));
      }
    });
    if (kind === "rightouter" || kind === "fullouter") {
      rightRows.forEach(function (r) {
        if (!matchedRightKeys[r[rightKey]]) result.push(mergeRow(null, r));
      });
    }
    return result;
  }

  var KUSTO_STAGE_HANDLERS = {
    where: function (rows, clause) { return kustoApplyWhere(rows, clause); },
    project: function (rows, clause) { return kustoApplyProject(rows, clause); },
    summarize: function (rows, clause) { return kustoApplySummarize(rows, clause); },
    top: function (rows, clause) { return kustoApplyTopOrSort(rows, clause, true); },
    sort: function (rows, clause) { return kustoApplyTopOrSort(rows, clause.replace(/^by\s+/, ""), false); },
    order: function (rows, clause) { return kustoApplyTopOrSort(rows, clause.replace(/^by\s+/, ""), false); },
    take: function (rows, clause) { var n = Number(clause.trim()); if (isNaN(n)) throw new Error("숫자가 아닙니다: " + clause.trim()); return rows.slice(0, n); },
    limit: function (rows, clause) { var n = Number(clause.trim()); if (isNaN(n)) throw new Error("숫자가 아닙니다: " + clause.trim()); return rows.slice(0, n); },
    join: function (rows, clause) { return kustoApplyJoin(rows, clause); }
  };

  var KUSTO_NO_COLCHECK_OPS = { join: true, summarize: true };

  function runKustoQuery2(queryText) {
    var text = (queryText || "").trim();
    if (!text) return { error: true, message: "쿼리가 비어 있습니다." };
    var letRe = /^let\s+(\w+)\s*=\s*(.+?);\s*/;
    var letMatch, bindings = {};
    while ((letMatch = text.match(letRe))) {
      bindings[letMatch[1]] = letMatch[2].trim();
      text = text.slice(letMatch[0].length);
    }
    Object.keys(bindings).forEach(function (name) {
      text = text.split(new RegExp("\\b" + name + "\\b", "g")).join(bindings[name]);
    });
    var stages = text.split("\n").join(" ").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
    var tableName = stages.shift();
    if (!KUSTO_TABLES[tableName]) {
      return { error: true, stageIndex: 0, message: "알 수 없는 테이블: " + tableName + " (지원 테이블: " + Object.keys(KUSTO_TABLES).join(", ") + ")" };
    }
    var rows = KUSTO_TABLES[tableName].slice();
    var trace = [{ stage: tableName, resultCount: rows.length }];
    var chartType = null;
    var currentColumns = rows.length ? Object.keys(rows[0]) : [];

    for (var i = 0; i < stages.length; i++) {
      var stage = stages[i];
      var opMatch = stage.match(/^(\w+)\s*([\s\S]*)$/);
      var op = opMatch ? opMatch[1] : "";
      var clause = opMatch ? opMatch[2] : "";
      if (op === "render") {
        if (i !== stages.length - 1) {
          return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지에서 실패: render는 파이프라인의 마지막 스테이지에서만 사용할 수 있습니다", trace: trace };
        }
        var renderMatch = clause.trim().match(/^(timechart|barchart|columnchart|piechart)/);
        chartType = renderMatch ? renderMatch[1] : null;
        if (!renderMatch) return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지에서 실패: 지원하지 않는 render 유형입니다 (지원: timechart/barchart/columnchart/piechart)", trace: trace };
        continue;
      }
      var handler = KUSTO_STAGE_HANDLERS[op];
      if (!handler) {
        return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지에서 실패: 지원하지 않는 연산자 `" + op + "` (이 시뮬레이터의 화이트리스트 밖입니다. 실제 Kusto에서는 지원될 수 있습니다)", trace: trace };
      }
      if (currentColumns && op === "where") {
        var refs = clause.split(/\s+and\s+/i).map(function (c) {
          var u = c.match(/^(?:isnull|isnotempty)\((\w+)\)$/);
          if (u) return u[1];
          var mm = c.match(/^(\w+)\s*(==|!=|>=|<=|>|<|!contains|contains)/);
          return mm ? mm[1] : null;
        }).filter(Boolean);
        var badCols = refs.filter(function (c) { return currentColumns.indexOf(c) === -1; });
        if (badCols.length) {
          return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지(`" + op + "`)에서 실패: 존재하지 않는 컬럼 `" + badCols.join(", ") + "` (사용 가능한 컬럼: " + currentColumns.join(", ") + ")", trace: trace };
        }
      }
      try {
        rows = handler(rows, clause);
      } catch (e) {
        return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지(`" + op + "`)에서 실패: " + e.message, trace: trace };
      }
      currentColumns = KUSTO_NO_COLCHECK_OPS[op] ? null : (op === "project" ? clause.split(",").map(function (s) { return s.trim(); }) : currentColumns);
      trace.push({ stage: op, resultCount: rows.length });
    }
    var columns = rows.length ? Object.keys(rows[0]) : [];
    return { error: false, columns: columns, rows: rows, trace: trace, chartType: chartType };
  }

  var CHART_COLORS = ["#3260CC", "#D97706", "#059669", "#DC2626"];

  function pickNumericCols(columns, rows) {
    if (!rows.length) return [];
    return columns.filter(function (c) {
      return typeof rows[0][c] === "number";
    });
  }

  function renderChart(result, opts) {
    opts = opts || {};
    if (result.error) return "";
    if (!result.rows.length) return '<p class="empty-hint">결과 0건 — 차트를 그릴 데이터가 없습니다.</p>';
    var columns = result.columns;
    var categoryCol = columns[0];
    var numericCols = opts.seriesCols || pickNumericCols(columns, result.rows);
    if (!numericCols.length) return '<p class="empty-hint">차트로 표현할 숫자 컬럼이 없습니다.</p>';
    var rows = result.rows;
    var w = 640, h = 280, pad = 40;

    if (result.chartType === "timechart") {
      var xs = rows.map(function (r) { return new Date(r[categoryCol]).getTime(); });
      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs) || minX + 1;
      var seriesSvg = numericCols.map(function (col, si) {
        var vals = rows.map(function (r) { return Number(r[col]); });
        var maxY = Math.max.apply(null, vals) || 1;
        var pts = rows.map(function (r, i) {
          var x = pad + (xs[i] - minX) / (maxX - minX || 1) * (w - 2 * pad);
          var y = h - pad - (Number(r[col]) / maxY) * (h - 2 * pad);
          return x.toFixed(1) + "," + y.toFixed(1);
        }).join(" ");
        return '<polyline points="' + pts + '" fill="none" stroke="' + CHART_COLORS[si % CHART_COLORS.length] + '" stroke-width="2"/>';
      }).join("");
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:640px">' + seriesSvg + '</svg>';
    }

    if (result.chartType === "piechart") {
      var col0 = numericCols[0];
      var total = rows.reduce(function (s, r) { return s + Number(r[col0]); }, 0) || 1;
      var cx = 120, cy = 120, r = 100, angle = -Math.PI / 2;
      var slices = rows.map(function (row, i) {
        var frac = Number(row[col0]) / total;
        var start = angle;
        angle += frac * 2 * Math.PI;
        var x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
        var x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
        var large = frac > 0.5 ? 1 : 0;
        var d = "M" + cx + "," + cy + " L" + x1.toFixed(1) + "," + y1.toFixed(1) + " A" + r + "," + r + " 0 " + large + " 1 " + x2.toFixed(1) + "," + y2.toFixed(1) + " Z";
        return '<path d="' + d + '" fill="' + CHART_COLORS[i % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + ": " + row[col0]) + '</title></path>';
      }).join("");
      return '<svg viewBox="0 0 240 240" width="280">' + slices + '</svg>';
    }

    // barchart(가로) / columnchart(세로)
    var isColumn = result.chartType === "columnchart";
    var allVals = [];
    numericCols.forEach(function (c) { rows.forEach(function (r) { allVals.push(Number(r[c])); }); });
    var maxV = Math.max.apply(null, allVals) || 1;
    var n = rows.length, sCount = numericCols.length;
    var bars = "";
    if (isColumn) {
      var colW = (w - 2 * pad) / n;
      rows.forEach(function (row, i) {
        numericCols.forEach(function (col, si) {
          var bw = colW / sCount - 4;
          var bh = (Number(row[col]) / maxV) * (h - 2 * pad);
          var x = pad + i * colW + si * (bw + 2);
          var y = h - pad - bh;
          bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + CHART_COLORS[si % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + " " + col + ": " + row[col]) + '</title></rect>';
        });
      });
    } else {
      var rowH = (h - 2 * pad) / n;
      rows.forEach(function (row, i) {
        numericCols.forEach(function (col, si) {
          var bh2 = rowH / sCount - 4;
          var bw2 = (Number(row[col]) / maxV) * (w - 2 * pad);
          var y2 = pad + i * rowH + si * (bh2 + 2);
          bars += '<rect x="' + pad + '" y="' + y2.toFixed(1) + '" width="' + bw2.toFixed(1) + '" height="' + bh2.toFixed(1) + '" fill="' + CHART_COLORS[si % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + " " + col + ": " + row[col]) + '</title></rect>';
        });
      });
    }
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:640px">' + bars + '</svg>';
  }

  function storageAvailable() {
    try { var k = "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }
  var HAS_STORAGE = storageAvailable();
  function loadState() {
    var raw = HAS_STORAGE ? localStorage.getItem("kqlJoinLabState") : MEMORY_STORE.kqlJoinLabState;
    if (!HAS_STORAGE) document.getElementById("storageBanner").classList.add("show");
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return { activeTab: "tutorial", answers: {}, tutorialStep: 0 };
  }
  var state = loadState();
  function persist() {
    var raw = JSON.stringify(state);
    if (HAS_STORAGE) { try { localStorage.setItem("kqlJoinLabState", raw); } catch (e) {} }
    else { MEMORY_STORE.kqlJoinLabState = raw; }
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setActiveTab(tab) {
    state.activeTab = tab; persist();
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
    render();
  }
  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-tab]");
    if (btn) setActiveTab(btn.getAttribute("data-tab"));
  });
  function render() {
    var app = document.getElementById("app");
    if (state.activeTab === "tutorial") app.innerHTML = "<p>튜토리얼 준비 중(Task 5에서 구현)</p>";
    else app.innerHTML = "<p>예제 준비 중(Task 4에서 구현)</p>";
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === state.activeTab); });
    render();
  });
</script>
</body>
