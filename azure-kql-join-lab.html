    raw = raw.trim();

  var KUSTO_NO_COLCHECK_OPS = { join: true, summarize: true };

  function runKustoQuery2(queryText) {
    var text = (queryText || "").trim();

      if (!handler) {
        return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지에서 실패: 지원하지 않는 연산자 `" + op + "` (이 시뮬레이터의 화이트리스트 밖입니다. 실제 Kusto에서는 지원될 수 있습니다)", trace: trace };

        var badCols = refs.filter(function (c) { return currentColumns.indexOf(c) === -1; });
        if (badCols.length) {
          return { error: true, stageIndex: i + 1, message: (i + 1) + "번째 스테이지(`" + op + "`)에서 실패: 존재하지 않는 컬럼 `" + badCols.join(", ") + "` (사용 가능한 컬럼: " + currentColumns.join(", ") + ")", trace: trace };

  function renderChart(result, opts) {
    opts = opts || {};
    if (result.error) return "";
    if (!result.rows.length) return '<p class="empty-hint">결과 0건 — 차트를 그릴 데이터가 없습니다.</p>';
    var columns = result.columns;
    var categoryCol = columns[0];
    var numericCols = (opts.seriesCols || pickNumericCols(columns, result.rows)).filter(function (c) { return columns.indexOf(c) !== -1; });
    if (!numericCols.length) return '<p class="empty-hint">차트로 표현할 숫자 컬럼이 없습니다.</p>';
    if (!result.chartType) return "";
    var rows = result.rows;
    var w = 640, h = 280, pad = 40;

    if (result.chartType === "timechart") {

      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs) || minX + 1;
      var seriesSvg = numericCols.map(function (col, si) {
        var vals = rows.map(function (r) { return Number(r[col]); });
        var maxY = Math.max.apply(null, vals) || 1;
        var pts = rows.map(function (r, i) {

          var y = h - pad - (Number(r[col]) / maxY) * (h - 2 * pad);
          return x.toFixed(1) + "," + y.toFixed(1);

        return '<polyline points="' + pts + '" fill="none" stroke="' + CHART_COLORS[si % CHART_COLORS.length] + '" stroke-width="2"/>';
      }).join("");
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:640px">' + seriesSvg + '</svg>';
    }

    if (result.chartType === "piechart") {
      var col0 = numericCols[0];
      var total = rows.reduce(function (s, r) { return s + Number(r[col0]); }, 0) || 1;
      var cx = 120, cy = 120, r = 100, angle = -Math.PI / 2;
      var slices = rows.map(function (row, i) {
        var frac = Number(row[col0]) / total;
        var start = angle;
        angle += frac * 2 * Math.PI;
        var x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
        var x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
        var large = frac > 0.5 ? 1 : 0;
        var d = "M" + cx + "," + cy + " L" + x1.toFixed(1) + "," + y1.toFixed(1) + " A" + r + "," + r + " 0 " + large + " 1 " + x2.toFixed(1) + "," + y2.toFixed(1) + " Z";
        return '<path d="' + d + '" fill="' + CHART_COLORS[i % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + ": " + row[col0]) + '</title></path>';
      }).join("");

    }

    // barchart(가로) / columnchart(세로)
    var isColumn = result.chartType === "columnchart";
    var allVals = [];
    numericCols.forEach(function (c) { rows.forEach(function (r) { allVals.push(Number(r[c])); }); });

    var n = rows.length, sCount = numericCols.length;
    var bars = "";

      var colW = (w - 2 * pad) / n;
      rows.forEach(function (row, i) {
        numericCols.forEach(function (col, si) {

          var bh = (Number(row[col]) / maxV) * (h - 2 * pad);

          var y = h - pad - bh;
          bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + CHART_COLORS[si % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + " " + col + ": " + row[col]) + '</title></rect>';
        });
      });
    } else {
      var rowH = (h - 2 * pad) / n;
      rows.forEach(function (row, i) {
        numericCols.forEach(function (col, si) {
          var bh2 = rowH / sCount - 4;
          var bw2 = (Number(row[col]) / maxV) * (w - 2 * pad);
          var y2 = pad + i * rowH + si * (bh2 + 2);
          bars += '<rect x="' + pad + '" y="' + y2.toFixed(1) + '" width="' + bw2.toFixed(1) + '" height="' + bh2.toFixed(1) + '" fill="' + CHART_COLORS[si % CHART_COLORS.length] + '"><title>' + escapeHtml(row[categoryCol] + " " + col + ": " + row[col]) + '</title></rect>';

  }

  }

  function renderExamplesTab() {
    var groupLabels = { single: "단일 테이블 예제", join2: "2테이블 join 예제", join3: "3테이블 조합 예제" };
    var html = "";
    ["single", "join2", "join3"].forEach(function (g) {
      html += "<h2>" + groupLabels[g] + "</h2>";
      html += KQL_EXAMPLES.filter(function (ex) { return ex.group === g; }).map(renderExampleCard).join("");
    });
    return html;
  }

  function storageAvailable() {
    try { var k = "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }
  var HAS_STORAGE = storageAvailable();
  function loadState() {
    var raw = HAS_STORAGE ? localStorage.getItem("kqlJoinLabState") : MEMORY_STORE.kqlJoinLabState;
    if (!HAS_STORAGE) document.getElementById("storageBanner").classList.add("show");
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return { activeTab: "tutorial", answers: {}, tutorialStep: 0 };
  }
  var state = loadState();
  function persist() {
    var raw = JSON.stringify(state);
    if (HAS_STORAGE) { try { localStorage.setItem("kqlJoinLabState", raw); } catch (e) {} }
    else { MEMORY_STORE.kqlJoinLabState = raw; }
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setActiveTab(tab) {
    state.activeTab = tab; persist();
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
    render();
  }
  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-tab]");
    if (btn) setActiveTab(btn.getAttribute("data-tab"));
  });
  var KQL_TUTORIAL_STEPS = [
    { title: "1. 왜 테이블이 3개인가", body: "게이트웨이(ApiManagementGatewayLogs) → 백엔드(AppRequests) → DB(AppDependencies) 순서로 요청이 흘러갑니다. 게이트웨이 21건 중 5건(OP-1003/1004/1007/1011/1012)은 인증/속도제한으로 차단되어 백엔드에 도달하지 못하고, 나머지 16건만 백엔드에 도달합니다. 이 16건 중 2건은 캐시 히트라 DB를 호출하지 않고, 1건(OP-1021)은 백엔드 자체 로직에서 실패로 기록되어 역시 DB를 호출하지 않아 13건만 DB를 호출합니다. 여기에 APIM 게이트웨이를 거치지 않은 백그라운드 작업 2건(OP-BG01/OP-BG02)이 DB 테이블에 별도로 추가되어, 세 테이블의 행 수는 21 → 16 → 15(13건 상관 + 2건 별도 백그라운드 작업)로 자연스럽게 달라집니다. 아래 쿼리로 게이트웨이 응답코드 분포를 먼저 확인해 보세요.",
      query: "ApiManagementGatewayLogs\n| summarize count() by ResponseCode\n| render piechart" },
    { title: "2. 단일 테이블 기초: where / project", body: "`where`로 행을 거르고 `project`로 필요한 컬럼만 남깁니다. 아래는 orders-api의 요청만 골라 URL과 처리시간만 남기는 예시입니다.",
      query: "ApiManagementGatewayLogs\n| where ApiId == \"orders-api\"\n| project Url, TotalTime" },
    { title: "3. 집계와 시간 버킷: summarize by bin()", body: "`summarize`는 그룹별 집계를, `bin(컬럼, 간격)`은 시간을 일정 간격으로 묶습니다. 두 개를 합치면 시계열 차트의 재료가 됩니다.",
      query: "ApiManagementGatewayLogs\n| summarize count() by bin(TimeGenerated, 5m)\n| render timechart" },
    { title: "4. 순위와 정렬: top / sort by", body: "`top N by 컬럼`은 상위 N건을, `sort by 컬럼 desc`는 전체 정렬을 반환합니다. 느린 요청을 찾을 때 자주 씁니다.",
      query: "ApiManagementGatewayLogs\n| project ApiId, TotalTime\n| top 5 by TotalTime desc\n| render barchart" },
    { title: "5. join 문법: 종류와 on 절", body: "`join kind=inner (오른쪽테이블) on 컬럼`은 두 테이블에서 컬럼 값이 같은 행끼리 합칩니다. 컬럼명이 다르면 `on $left.A == $right.B` 형태를 씁니다. kind는 4가지: inner(양쪽 다 있는 행만), leftouter(왼쪽 전부 + 매칭된 오른쪽), rightouter(오른쪽 전부 + 매칭된 왼쪽), fullouter(양쪽 전부, 매칭 안 된 쪽은 null). 아래는 게이트웨이와 백엔드를 OperationId로 합치는 예시입니다.",
      query: "ApiManagementGatewayLogs\n| join kind=inner (AppRequests) on OperationId\n| project ApiId, TotalTime, DurationMs" },
    { title: "6. 실전 조합: 3테이블 대시보드", body: "join을 두 번 이어 붙이면 3개 테이블을 모두 조합할 수 있습니다. 이렇게 만든 결과를 여러 차트로 나눠 한 화면에 배치하는 것이 Azure Workbook 대시보드의 기본 패턴입니다 — 워크북은 이런 쿼리 결과를 텍스트/파라미터 셀과 함께 하나의 문서로 묶어 보여주는 도구입니다.",
      query: "ApiManagementGatewayLogs\n| join kind=inner (AppRequests) on OperationId\n| join kind=inner (AppDependencies) on OperationId\n| summarize avg(TotalTime), avg(DurationMs) by ApiId\n| render columnchart",
      chartOpts: { seriesCols: ["avg_TotalTime", "avg_DurationMs"] } }
  ];

  function renderTutorialTab() {
    var i = state.tutorialStep || 0;
    var step = KQL_TUTORIAL_STEPS[i];
    var result = runKustoQuery2(step.query);
    var resultHtml = result.error
      ? '<div class="kql-error">' + escapeHtml(result.message) + '</div>'
      : renderResultTable(result) + renderChart(result, step.chartOpts);
    return '<div class="example-card">' +
      '<p style="color:var(--text-dim);font-size:var(--fs-xs)">' + (i + 1) + " / " + KQL_TUTORIAL_STEPS.length + '</p>' +
      '<h2>' + escapeHtml(step.title) + '</h2>' +
      '<p>' + escapeHtml(step.body) + '</p>' +
      '<textarea class="kql-editor" readonly>' + escapeHtml(step.query) + '</textarea>' +
      resultHtml +
      '<div style="margin-top:8px;display:flex;gap:8px;">' +
      '<button class="btn" data-tutorial-action="prev"' + (i === 0 ? " disabled" : "") + '>이전</button>' +
      '<button class="btn primary" data-tutorial-action="next"' + (i === KQL_TUTORIAL_STEPS.length - 1 ? " disabled" : "") + '>다음</button>' +
      '</div></div>';
  }

  function render() {
    var app = document.getElementById("app");
    if (state.activeTab === "tutorial") app.innerHTML = renderTutorialTab();
    else app.innerHTML = renderExamplesTab();
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var card = e.target.closest("[data-example-id]");
    if (card) {
      var id = card.getAttribute("data-example-id");
      var btn = e.target.closest("button");
      var action = btn && btn.getAttribute("data-action");
      if (action === "run") {
        var editor = card.querySelector("[data-role='editor']");
        state.answers[id] = state.answers[id] || {};
        state.answers[id].userQuery = editor.value;
        state.answers[id].lastResult = runKustoQuery2(editor.value);
        persist();
        render();
      } else if (action === "reveal") {
        state.answers[id] = state.answers[id] || {};
        state.answers[id].revealed = !state.answers[id].revealed;
        persist();
        render();
      }
      return;
    }
    var tstep = e.target.closest("[data-tutorial-action]");
    if (tstep && KQL_TUTORIAL_STEPS.length) {
      var dir = tstep.getAttribute("data-tutorial-action");
      state.tutorialStep = Math.max(0, Math.min(KQL_TUTORIAL_STEPS.length - 1, (state.tutorialStep || 0) + (dir === "next" ? 1 : -1)));
      persist();
      render();
    }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var card = e.target.closest("[data-example-id]");
    if (card && e.target.getAttribute("data-role") === "editor") {
      var id = card.getAttribute("data-example-id");
      state.answers[id] = state.answers[id] || {};
      state.answers[id].userQuery = e.target.value;
      persist();
    }
  });
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === state.activeTab); });
    render();
  });
</script>
</body>
</html>
